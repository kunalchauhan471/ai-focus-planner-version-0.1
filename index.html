<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Focus Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= ENTRY GATE (NEW FEATURE) ================= -->
<div id="entryGate" class="container card" style="max-width:420px">

  <h2>Welcome</h2>

  <!-- CHOICE -->
  <div id="choiceBox">
    <button class="primary" onclick="showNew()">I’m New</button>
    <button class="secondary" onclick="showExisting()" style="margin-top:10px">
      I Already Use This
    </button>
  </div>

  <!-- NEW USER -->
  <div id="newUser" style="display:none">
    <input id="nameInput" placeholder="Your name">
    <textarea id="intentionInput" placeholder="What do you want to fix or focus on?"></textarea>
    <input id="pinCreate" type="password" maxlength="4" placeholder="Create 4-digit PIN">
    <button class="primary" onclick="createProfile()">Create & Enter</button>
  </div>

  <!-- EXISTING USER -->
  <div id="existingUser" style="display:none">
    <input id="pinEnter" type="password" maxlength="4" placeholder="Enter 4-digit PIN">
    <button class="primary" onclick="unlock()">Enter Planner</button>
  </div>

</div>
<!-- ============================================================ -->


<!-- ================= YOUR ORIGINAL PLANNER (UNCHANGED) ================= -->
<div class="container" id="plannerApp" style="display:none">

<div class="progress"><div id="bar" class="progress-bar"></div></div>

<!-- SLIDE 1 -->
<div class="slide active card">
<h2>Main Focus Day</h2>
<select id="mainDay">
<option>Monday</option><option>Tuesday</option><option>Wednesday</option>
<option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
</select>
<div class="nav">
<span></span>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 2 -->
<div class="slide card">
<h2>Add Weekly Goals</h2>
<input id="goalInput" placeholder="Example: Complete Unit 1">
<button class="primary" onclick="addGoal()">Add Goal</button>
<div id="goals"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 3 -->
<div class="slide card">
<h2>Add Tasks per Goal</h2>
<div id="tasksArea"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="prepareBatch()">Next</button>
</div>
</div>

<!-- SLIDE 4 -->
<div class="slide card">
<h2>Task Batching & Color Coding</h2>
<div id="batchArea"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 5 -->
<div class="slide card">
<h2>Reward & Punishment</h2>
<input id="reward" placeholder="Reward">
<input id="punishment" placeholder="Punishment">
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="generate()">Generate</button>
</div>
</div>

<!-- SLIDE 6 -->
<div class="slide card">
<h2>Your Weekly Timetable</h2>
<div class="timetable" id="table"></div>

<h3 style="margin-top:24px">Color Legend</h3>
<div id="legend" class="legend"></div>
</div>

</div>
<!-- ===================================================================== -->


<!-- YOUR ORIGINAL SCRIPT -->
<script src="script.js"></script>

<!-- ENTRY GATE LOGIC (NEW FILE) -->
<script src="auth.js"></script>

</body>
</html>
