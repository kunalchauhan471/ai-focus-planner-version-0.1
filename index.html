<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Focus Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
/* ENTRY GATE ONLY */
.entry-gate{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.entry-card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:32px;
  width:100%;
  max-width:420px;
  text-align:center;
}
.entry-card h2{margin-bottom:12px}
.entry-card input{
  margin-top:12px;
}
.hidden{display:none}
</style>
</head>

<body>

<!-- ENTRY GATE -->
<div class="entry-gate" id="entryGate">
  <div class="entry-card">
    <h2>Welcome</h2>
    <p>Focus system for students</p>

    <div id="choice">
      <button class="primary" onclick="showSignup()">New User</button>
      <button class="secondary" onclick="showSignin()">Existing User</button>
    </div>

    <div id="signup" class="hidden">
      <input id="name" placeholder="Your name">
      <input id="intent" placeholder="Your intention">
      <input id="pin" type="password" maxlength="4" placeholder="Create 4-digit PIN">
      <button class="primary" onclick="signup()">Create</button>
    </div>

    <div id="signin" class="hidden">
      <input id="loginPin" type="password" maxlength="4" placeholder="Enter PIN">
      <button class="primary" onclick="signin()">Enter</button>
    </div>
  </div>
</div>

<!-- PLANNER (UNCHANGED) -->
<div class="container hidden" id="plannerApp">

<div class="progress"><div id="bar" class="progress-bar"></div></div>

<!-- SLIDE 1 -->
<div class="slide active card">
<h2>Main Focus Day</h2>
<select id="mainDay">
<option>Monday</option><option>Tuesday</option><option>Wednesday</option>
<option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
</select>
<div class="nav">
<span></span>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 2 -->
<div class="slide card">
<h2>Add Weekly Goals</h2>
<input id="goalInput" placeholder="Example: Complete Unit 1">
<button class="primary" onclick="addGoal()">Add Goal</button>
<div id="goals"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 3 -->
<div class="slide card">
<h2>Add Tasks per Goal</h2>
<div id="tasksArea"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="prepareBatch()">Next</button>
</div>
</div>

<!-- SLIDE 4 -->
<div class="slide card">
<h2>Task Batching & Color Coding</h2>
<div id="batchArea"></div>
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="next()">Next</button>
</div>
</div>

<!-- SLIDE 5 -->
<div class="slide card">
<h2>Reward & Punishment</h2>
<input id="reward" placeholder="Reward">
<input id="punishment" placeholder="Punishment">
<div class="nav">
<button class="secondary" onclick="back()">Back</button>
<button class="primary" onclick="generate()">Generate</button>
</div>
</div>

<!-- SLIDE 6 -->
<div class="slide card">
<h2>Your Weekly Timetable</h2>
<div class="timetable" id="table"></div>
<h3 style="margin-top:24px">Color Legend</h3>
<div id="legend" class="legend"></div>
</div>

</div>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
